<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - 时尚衣橱</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <a href="index.html" class="logo">时尚<span>衣橱</span></a>
            <nav class="nav">
                <ul>
                    <li><a href="index.html">首页</a></li>
                    <li><a href="products.html">商品展示</a></li>
                    <li><a href="cart.html">购物车</a></li>
                    <li><a href="orders.html" class="active">订单管理</a></li>
                    <li><a href="favorites.html">我的收藏</a></li>
                </ul>
            </nav>
            <div class="header-right">
                <div class="search-box">
                    <input type="text" placeholder="搜索商品..." id="searchInput">
                    <button class="search-btn" onclick="searchProducts()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                </div>
                <div class="user-actions">
                    <a href="login.html" class="login-link">登录</a>
                    <a href="login.html#register" class="register-link">注册</a>
                    <div class="user-menu" style="display: none;">
                        <div class="user-avatar">
                            <span class="avatar-icon">👤</span>
                            <span class="user-name">用户</span>
                            <span class="dropdown-arrow">▼</span>
                        </div>
                        <div class="dropdown-menu">
                            <a href="orders.html">我的订单</a>
                            <a href="cart.html">购物车</a>
                            <a href="favorites.html">我的收藏</a>
                            <a href="#" class="logout-btn">退出登录</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <section class="page-header">
        <div class="container">
            <a href="index.html" class="back-home-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                返回首页
            </a>
            <h1>我的订单</h1>
            <p>查看和管理您的订单</p>
        </div>
    </section>

    <section class="orders-section">
        <div class="container">
            <div class="orders-container" id="ordersContainer">
                <!-- 订单列表将通过JavaScript动态加载 -->
            </div>
            <!-- 订单分页 -->
            <div class="orders-pagination" id="ordersPagination">
                <!-- 分页将通过JavaScript动态加载 -->
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-grid">
                <div class="footer-section">
                    <h3>关于我们</h3>
                    <ul>
                        <li><a href="#">品牌故事</a></li>
                        <li><a href="#">企业文化</a></li>
                        <li><a href="#">加入我们</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>客户服务</h3>
                    <ul>
                        <li><a href="#">帮助中心</a></li>
                        <li><a href="#">退换货政策</a></li>
                        <li><a href="#">配送说明</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>联系方式</h3>
                    <ul>
                        <li>客服热线：400-123-4567</li>
                        <li>工作时间：9:00-21:00</li>
                        <li>邮箱：service@fashion.com</li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h3>关注我们</h3>
                    <div class="social-links">
                        <a href="#">微信</a>
                        <a href="#">微博</a>
                        <a href="#">小红书</a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 时尚衣橱 版权所有</p>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            initNavigation();
            initUserDisplay();
            initSearchBox();
            
            // 检查登录状态
            if (!checkLoginStatus()) {
                showLoginPrompt('ordersContainer', '请先登录后查看订单');
                return;
            }
            
            renderOrdersPage();
            updateOrderBadge();
        });
    </script>
</body>
</html>
